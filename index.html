<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>환전 계산기</title>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
:root{--olive:#9ACD32;}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
body{background:#f4f7f3;margin:0;padding:10px;}
.wrap{max-width:430px;margin:auto;}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
h1{text-align:center;color:#7fb428;font-size:22px;margin:4px 0 12px;}
.header,.row{display:grid;grid-template-columns:70px 1fr 120px;gap:6px;align-items:center;}
.header{font-size:12px;color:#666;border-bottom:1px solid #eee;padding-bottom:6px;margin-bottom:6px;}
.row{margin:6px 0;}
.amount{text-align:right;font-weight:700;}
.ctrl{display:flex;gap:4px;align-items:center;}
.ctrl button{width:32px;height:32px;}
.ctrl input{flex:1;height:32px;text-align:center;}
.total{background:var(--olive);color:#fff;border-radius:12px;padding:10px;text-align:center;margin-top:10px;}
.total div:last-child{font-size:28px;font-weight:700;}
.actions{display:flex;gap:8px;margin-top:10px;}
.actions button{flex:1;height:44px;border:none;border-radius:10px;font-weight:700;}
.save{background:var(--olive);color:#fff;}
.home{background:#555;color:#fff;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;}
</style>
</head>
<body>
<div class="wrap">
<div class="card" id="captureArea">
<h1>환전 계산기</h1>
<div id="stamp" style="font-size:11px;color:#666;text-align:right"></div>
<div class="header"><div>권종</div><div>금액</div><div>수량</div></div>

<div class="row"><div>1만원</div><div class="amount" id="a10000">0원</div><div class="ctrl"><button onclick="chg('m10000',-1)">-</button><input id="m10000" type="number" value="0"><button onclick="chg('m10000',1)">+</button></div></div>
<div class="row"><div>5천원</div><div class="amount" id="a5000">0원</div><div class="ctrl"><button onclick="chg('m5000',-1)">-</button><input id="m5000" type="number" value="0"><button onclick="chg('m5000',1)">+</button></div></div>
<div class="row"><div>1천원</div><div class="amount" id="a1000">0원</div><div class="ctrl"><button onclick="chg('m1000',-1)">-</button><input id="m1000" type="number" value="0"><button onclick="chg('m1000',1)">+</button></div></div>
<div class="row"><div>500원</div><div class="amount" id="a500">0원</div><div class="ctrl"><button onclick="chg('m500',-1)">-</button><input id="m500" type="number" value="0"><button onclick="chg('m500',1)">+</button></div></div>
<div class="row"><div>100원</div><div class="amount" id="a100">0원</div><div class="ctrl"><button onclick="chg('m100',-1)">-</button><input id="m100" type="number" value="0"><button onclick="chg('m100',1)">+</button></div></div>
<div class="row"><div>50원</div><div class="amount" id="a50">0원</div><div class="ctrl"><button onclick="chg('m50',-1)">-</button><input id="m50" type="number" value="0"><button onclick="chg('m50',1)">+</button></div></div>
<div class="row"><div>10원</div><div class="amount" id="a10">0원</div><div class="ctrl"><button onclick="chg('m10',-1)">-</button><input id="m10" type="number" value="0"><button onclick="chg('m10',1)">+</button></div></div>

<div class="total"><div>총 환전금액</div><div id="total">0원</div></div>
</div>

<div class="actions">
<button class="save" onclick="shareImage()">📸 이미지 저장</button>
<button class="home" onclick="resetAll()">🏠 홈</button>
</div>
</div>
<div id="toast">완료</div>

<script>
const map={m10000:10000,m5000:5000,m1000:10000,m500:20000,m100:5000,m50:2500,m10:500};
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",calc));
function chg(id,d){const e=document.getElementById(id);e.value=Math.max(0,(+e.value||0)+d);calc();}
function calc(){
 let total=0;
 Object.keys(map).forEach(id=>{
   const v=(+document.getElementById(id).value||0)*map[id];
   document.getElementById("a"+id.replace("m","")).innerText=v.toLocaleString()+"원";
   total+=v;
 });
 document.getElementById("total").innerText=total.toLocaleString()+"원";
 localStorage.setItem("exchangeData",JSON.stringify([...document.querySelectorAll("input")].map(i=>i.value)));
}
function resetAll(){document.querySelectorAll("input").forEach(i=>i.value=0);calc();}
(function(){const d=JSON.parse(localStorage.getItem("exchangeData")||"[]");document.querySelectorAll("input").forEach((i,n)=>{if(d[n]) i.value=d[n]});calc();})();
async function shareImage(){
 document.getElementById('stamp').innerText=new Date().toLocaleString('ko-KR');
 const canvas=await html2canvas(document.getElementById('captureArea'),{scale:2});
 canvas.toBlob(async b=>{
   const f=new File([b],'exchange.png',{type:'image/png'});
   try{
     if(navigator.canShare&&navigator.canShare({files:[f]})){
       await navigator.share({files:[f],title:'환전 계산기'});
     }
     showToast('공유창이 열렸습니다');
   }catch(e){}
 });
}
function showToast(t){const x=document.getElementById('toast');x.innerText=t;x.style.display='block';setTimeout(()=>x.style.display='none',2000);}
</script>
</body>
</html>
