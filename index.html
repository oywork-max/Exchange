<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>환전 계산기</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    background:#f4f7f3;
    padding:10px;
}

.container{
    max-width:420px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    font-size:22px;
    font-weight:700;
    color:#9ACD32;
    margin-bottom:12px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
    gap:8px;
}

.label{
    width:95px;
    font-size:14px;
    font-weight:600;
}

.unit{
    font-size:11px;
    color:#666;
}

input{
    width:100px;
    height:38px;
    border:1px solid #ddd;
    border-radius:10px;
    text-align:center;
    font-size:16px;
}

.total-box{
    margin-top:12px;
    background:#9ACD32;
    color:white;
    border-radius:14px;
    padding:14px;
    text-align:center;
}

.total-label{
    font-size:14px;
}

.total{
    margin-top:4px;
    font-size:28px;
    font-weight:700;
}

.btn-area{
    display:flex;
    gap:8px;
    margin-top:12px;
}

button{
    flex:1;
    height:45px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.save-btn{
    background:#9ACD32;
    color:white;
}

.reset-btn{
    background:#555;
    color:white;
}

.footer{
    margin-top:10px;
    text-align:center;
    color:#888;
    font-size:11px;
}
</style>
</head>

<body>

<div class="container">

<div class="card" id="captureArea">

<div class="title">환전 계산기</div>

<div class="row">
<div class="label">1만원</div>
<input type="number" id="m10000" value="0">
</div>

<div class="row">
<div class="label">5천원</div>
<input type="number" id="m5000" value="0">
</div>

<div class="row">
<div class="label">
1천원<br>
<span class="unit">10장 단위</span>
</div>
<input type="number" id="m1000" value="0">
</div>

<div class="row">
<div class="label">
500원<br>
<span class="unit">1묶음=20,000원</span>
</div>
<input type="number" id="m500" value="0">
</div>

<div class="row">
<div class="label">
100원<br>
<span class="unit">1묶음=5,000원</span>
</div>
<input type="number" id="m100" value="0">
</div>

<div class="row">
<div class="label">
50원<br>
<span class="unit">1묶음=2,500원</span>
</div>
<input type="number" id="m50" value="0">
</div>

<div class="row">
<div class="label">
10원<br>
<span class="unit">1묶음=500원</span>
</div>
<input type="number" id="m10" value="0">
</div>

<div class="total-box">
<div class="total-label">총 환전금액</div>
<div class="total" id="total">0원</div>
</div>

</div>

<div class="btn-area">
<button class="save-btn" onclick="saveImage()">이미지 저장</button>
<button class="reset-btn" onclick="resetForm()">홈</button>
</div>

<div class="footer">
환전 계산기
</div>

</div>

<script>

const inputs = document.querySelectorAll("input");

inputs.forEach(input=>{
    input.addEventListener("input",calculate);
});

function calculate(){

    const m10000 = Number(document.getElementById("m10000").value)||0;
    const m5000  = Number(document.getElementById("m5000").value)||0;
    const m1000  = Number(document.getElementById("m1000").value)||0;

    const m500 = Number(document.getElementById("m500").value)||0;
    const m100 = Number(document.getElementById("m100").value)||0;
    const m50  = Number(document.getElementById("m50").value)||0;
    const m10  = Number(document.getElementById("m10").value)||0;

    const total =
        (m10000 * 10000) +
        (m5000 * 5000) +
        (m1000 * 10000) +
        (m500 * 20000) +
        (m100 * 5000) +
        (m50 * 2500) +
        (m10 * 500);

    document.getElementById("total").innerText =
        total.toLocaleString() + "원";
}

function resetForm(){

    document.querySelectorAll("input").forEach(input=>{
        input.value = 0;
    });

    calculate();
}

function saveImage(){

    html2canvas(document.getElementById("captureArea"),{
        scale:2
    }).then(canvas=>{

        const link = document.createElement("a");

        const date = new Date();
        const fileName =
            "환전계산기_" +
            date.getFullYear() +
            (date.getMonth()+1) +
            date.getDate() +
            ".png";

        link.download = fileName;
        link.href = canvas.toDataURL();
        link.click();
    });
}

calculate();

</script>

</body>
</html>
