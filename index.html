<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- 아이폰 -->
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="환전계산기">
<!-- 안드로이드 -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="application-name" content="환전계산기">
<!-- PWA -->
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>환전 계산기</title>
<style>
:root{--olive:#9ACD32;}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
body{background:#f4f7f3;margin:0;padding:12px;display:flex;justify-content:center;}
.wrap{width:100%;max-width:400px;margin:auto;}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.06);}
h1{text-align:center;color:#7fb428;font-size:22px;margin:4px 0 12px;}

.header,.row{display:grid;grid-template-columns:2fr 2.5fr 3.5fr;gap:4px;align-items:center;}
.header{font-size:12px;color:#666;border-bottom:1px solid #eee;padding-bottom:6px;margin-bottom:6px;text-align:center;}
.header div:nth-child(2){text-align:right;padding-right:5px;}
.row{margin:8px 0;}
.row > div:first-child{font-weight:500;font-size:14px;padding-left:4px;}
.amount{text-align:right;font-weight:700;color:#333;font-size:14px;padding-right:5px;word-break:break-all;}

.ctrl{display:flex;gap:2px;align-items:center;justify-content:flex-end;}
.ctrl button{width:28px;height:32px;border:1px solid #ddd;background:#fafafa;border-radius:4px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ctrl button:active{background:#eee;}
.ctrl input{width:45px;height:32px;text-align:center;border:1px solid #ddd;border-radius:4px;font-size:14px;-moz-appearance:textfield;}
.ctrl input::-webkit-outer-spin-button, .ctrl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.total{background:var(--olive);color:#fff;border-radius:12px;padding:12px;text-align:center;margin-top:14px;}
.total div:first-child{font-size:13px;opacity:0.9;margin-bottom:2px;}
.total div:last-child{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
.card {background: white; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.06);}
.label {font-weight: 700; margin-bottom: 4px; font-size: 14px;}
#targetAmount {width: 100%; height: 36px; font-size: 18px; padding: 6px 10px; border: 2px solid #cfe58b; border-radius: 10px;}
  
/* 안내 문구 스타일 */
.notice{text-align:center;font-size:13px;color:#666;margin-top:12px;font-weight:500;}

.actions{display:flex;margin-top:12px;}
.actions button{flex:1;height:46px;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#555;color:#fff;}
.actions button:active{background:#444;}

#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(34,34,34,0.9);color:#fff;padding:10px 20px;border-radius:24px;display:none;z-index:9999;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>환전 계산기</h1>
<div class="header"><div>권종</div><div>금액</div><div>수량</div></div>

<div class="row"><div>1만원</div><div class="amount" id="a10000">0원</div><div class="ctrl"><button onclick="chg('m10000',-1)">-</button><input id="m10000" type="number" value="0" min="0"><button onclick="chg('m10000',1)">+</button>장</div></div>
<div class="row"><div>5천원</div><div class="amount" id="a5000">0원</div><div class="ctrl"><button onclick="chg('m5000',-1)">-</button><input id="m5000" type="number" value="0" min="0"><button onclick="chg('m5000',1)">+</button>장</div></div>
<div class="row"><div>1천원</div><div class="amount" id="a1000">0원</div><div class="ctrl"><button onclick="chg('m1000',-10)">-</button><input id="m1000" type="number" value="0" min="0"><button onclick="chg('m1000',10)">+</button>장</div></div>
<div class="row"><div>500원</div><div class="amount" id="a500">0원</div><div class="ctrl"><button onclick="chg('m500',-1)">-</button><input id="m500" type="number" value="0" min="0"><button onclick="chg('m500',1)">+</button>묶음</div></div>
<div class="row"><div>100원</div><div class="amount" id="a100">0원</div><div class="ctrl"><button onclick="chg('m100',-1)">-</button><input id="m100" type="number" value="0" min="0"><button onclick="chg('m100',1)">+</button>묶음</div></div>
<div class="row"><div>50원</div><div class="amount" id="a50">0원</div><div class="ctrl"><button onclick="chg('m50',-1)">-</button><input id="m50" type="number" value="0" min="0"><button onclick="chg('m50',1)">+</button>묶음</div></div>
<div class="row"><div>10원</div><div class="amount" id="a10">0원</div><div class="ctrl"><button onclick="chg('m10',-1)">-</button><input id="m10" type="number" value="0" min="0"><button onclick="chg('m10',1)">+</button>묶음</div></div>

<div class="total"><div>총 환전금액</div><div id="total">0원</div></div>
<div class="notice">📸 캡쳐해서 사용하세요!</div>
</div>

<div class="card">
<div class="label">오늘의 송금액</div>
<input id="targetAmount" type="number" placeholder="금액 입력">
</div>
  
<div class="actions">
<button onclick="resetAll()">🏠 초기화</button>
</div>
</div>
<div id="toast">완료</div>

<script>
// 새로운 기획에 맞춘 권종별 수량 1당 곱해질 금액 매핑
const map={m10000:10000,m5000:5000,m1000:1000,m500:20000,m100:5000,m50:2500,m10:500};

document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("input",()=>{
    if(+i.value<0) i.value=0;
    calc();
  });
});

function chg(id,d){
  const e=document.getElementById(id);
  e.value=Math.max(0,(+e.value||0)+d);
  calc();
}

function calc(){
  let total=0;
  Object.keys(map).forEach(id=>{
    const v=(+document.getElementById(id).value||0)*map[id];
    document.getElementById("a"+id.replace("m","")).innerText=v.toLocaleString()+"원";
    total+=v;
  });
  document.getElementById("total").innerText=total.toLocaleString()+"원";
  localStorage.setItem("exchangeData2",JSON.stringify([...document.querySelectorAll("input")].map(i=>i.value)));
}

function resetAll(){
  document.querySelectorAll("input").forEach(i=>i.value=0);
  calc();
  showToast('초기화되었습니다');
}

(function(){
  const d=JSON.parse(localStorage.getItem("exchangeData2")||"[]");
  document.querySelectorAll("input").forEach((i,n)=>{if(d[n]) i.value=d[n]});
  calc();
})();

function showToast(t){
  const x=document.getElementById('toast');
  x.innerText=t;
  x.style.display='block';
  if(window.toastTimeout) clearTimeout(window.toastTimeout);
  window.toastTimeout=setTimeout(()=>x.style.display='none',2000);
}
</script>
</body>
</html>
